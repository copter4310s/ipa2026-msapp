<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="stylesheet" type="text/css" href="/static/style.css" />
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-danger">
            <div class="container-fluid d-flex justify-content-around">
                <span class="navbar-brand">
                    <b>IPA 2026</b>
                </span>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <span class="nav-link">it67070057</span>
                    </li>
                </ul>
            </div>
        </nav>
        <div class="container-fluid">
            <div class="container-md my-3">
                <div>
                    <h2 class="fw-semibold">
                        Welcome! คุณคือผู้ใช้งานจาก {{request.remote_addr}}
                    </h2>
                    <div class="px-3 text-secondary">
                        06016423 INFRASTRUCTURE PROGRAMMABILITY AND AUTOMATION
                    </div>
                </div>
                <hr>
                <div>
                    <h4 class="fw-semibold">
                        Router List
                    </h4>
                    <div class="mx-4">
                        <form method="POST" action="/add">
                            <div class="row">
                                <div class="col-3">
                                    <label for="ip" class="form-label m-0">IP Address</label>
                                    <input type="text" class="form-control" name="ip" id="ip" placeholder="172.31.67.x" required>
                                </div>
                                <div class="col-3">
                                    <label for="username" class="form-label m-0">Username</label>
                                    <input type="text" class="form-control" name="username" id="username" placeholder="cisco" required>
                                </div>
                                <div class="col-3">
                                    <label for="password" class="form-label m-0">Password</label>
                                    <input type="password" class="form-control" name="password" id="password" placeholder="cisco" required>
                                </div>
                                <div class="col-3 d-flex align-items-end">
                                    <button type="submit" class="btn btn-danger col-3 w-100">Add Router</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <hr class="mt-4 mx-4">
                <div class="mx-4">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th width="3%" class="text-center">
                                        #
                                    </th>
                                    <th width="45%">
                                        IP Address
                                    </th>
                                    <th width="25%">
                                        Username
                                    </th>
                                    <th with="27%">
                                        Action
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for router in data %}
                                <tr>
                                    <td class="text-center">
                                        {{ loop.index }}
                                    </td>
                                    <td>
                                        {{ router.ip }}
                                    </td>
                                    <td>
                                        {{ router.username }}
                                    </td>
                                    <td>
                                        <a href="/router/{{ router.ip }}" target="_blank" class="btn btn-outline-danger">
                                          View Interfaces
                                        </a>
                                        <form method="POST" action="{{ url_for('delete_router') }}" style="display:inline">
                                          <input type="hidden" name="id" value="{{ router._id }}">
                                          <button type="submit" class="btn btn-outline-danger">Delete</button>
                                        </form>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
